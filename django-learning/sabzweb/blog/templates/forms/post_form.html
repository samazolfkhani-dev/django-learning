{% extends 'parent\base.html' %}
{% block title %}Post Form{% endblock %}
{% load jformat %}

{% block content %}
    {% if post %}
        <p>Post Created!</p>
        <a href="{% url 'blog:index' %}">Back To Home</a>
    {% endif %}
    <form method="post" action="{% url 'blog:post_form' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Create Post">
    </form>
{% endblock %}
