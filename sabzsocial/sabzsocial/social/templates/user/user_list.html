{% load thumbnail %}
{% load static %}

{% for user in users %}
    {% if user.photo %}
        <a href = "{{ user.get_absolute_url }}">
            <img src="{% thumbnail user.photo 150x0 quality=90 %}">
        </a>
    {% else %}
        <a href = "{{ user.get_absolute_url }}">
            <img src="{% static 'profiles/images.jpg' %}" width="150">
        </a>
    {% endif %}
    <br>
    <a href = "{{ user.get_absolute_url }}">{{ user.get_full_name }}</a>
    <hr>
{% endfor %}
